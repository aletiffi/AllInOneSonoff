name: Release

# Creates a GitHub release:
#   - automatically when a pull request is merged into main
#     (PR labels: release:major / release:minor / release:patch choose the part to
#      increment, default the last number "build"; no-release skips the release)
#   - by hand: GitHub > Actions > Release > Run workflow
#
# Steps: unit tests, next version from the git tags (scripts/next_version.py),
# build with that version, OTA image signed with the OTA_PRIVATE_KEY secret,
# tag vX + release with:
#     AllInOneSonoff_v<version>.bin          firmware for the serial flash
#     AllInOneSonoff_v<version>.ota.bin.gz   signed OTA image
#     manifest.json                          OTA manifest for the devices
# Nothing is committed to main: the version lives in the tag only.
# The devices read https://github.com/<owner>/<repo>/releases/latest/download/manifest.json
#
# Required secret (Settings > Secrets and variables > Actions > Repository secrets):
#   OTA_PRIVATE_KEY = content of keys/private.key

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to increment (major.minor.patch.build)"
        type: choice
        options: [build, patch, minor, major]
        default: build

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       !contains(github.event.pull_request.labels.*.name, 'no-release'))
    steps:
      - uses: actions/checkout@v4
        with:
          # The merged code (merge commit of the PR, or main for a manual run)
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Version part to increment
        id: bump
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          part=build
          if [ "$EVENT" = "workflow_dispatch" ]; then
            part="$INPUT_BUMP"
          else
            for p in major minor patch; do
              if echo "$LABELS" | grep -q "\"release:$p\""; then part="$p"; break; fi
            done
          fi
          echo "part=$part" >> "$GITHUB_OUTPUT"
          echo "Increment: $part"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Unit tests (PC)
        run: |
          pio test -e native
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Next version
        id: version
        run: python3 scripts/next_version.py "${{ steps.bump.outputs.part }}" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
        run: |
          if [ -z "$OTA_PRIVATE_KEY" ]; then
            echo "::error::Secret OTA_PRIVATE_KEY missing: add the content of keys/private.key in Settings > Secrets and variables > Actions > Repository secrets"
            exit 1
          fi
          umask 077
          printf '%s\n' "$OTA_PRIVATE_KEY" > keys/private.key

      # signing.py builds with FW_VERSION, checks the key against keys/public.key and signs
      - name: Build firmware
        env:
          FW_VERSION: ${{ steps.version.outputs.version }}
        run: pio run -e sonoff_sv

      - name: Remove signing key
        if: always()
        run: rm -f keys/private.key

      - name: Release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          name="AllInOneSonoff_v${VERSION}"
          test -f "${name}.bin"
          test -f "${name}.ota.bin.gz"
          mkdir -p release
          cp "${name}.bin" "${name}.ota.bin.gz" release/
          python3 scripts/make_manifest.py "$VERSION" \
            "https://github.com/${REPO}/releases/download/v${VERSION}/${name}.ota.bin.gz" release/manifest.json
          {
            echo "## AllInOneSonoff v${VERSION}"
            echo
            echo "| File | Use |"
            echo "|---|---|"
            echo "| \`${name}.bin\` | First flash by serial |"
            echo "| \`${name}.ota.bin.gz\` | OTA update (gzip + signed) |"
            echo "| \`manifest.json\` | OTA manifest |"
            echo
            echo "The devices with an empty *Firmware update url* install this release by themselves within an hour."
            echo
            echo "SHA256:"
            echo '```'
            (cd release && sha256sum ./*.bin ./*.gz manifest.json | sed "s#\./##")
            echo '```'
          } > release/notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          gh release create "v${VERSION}" \
            --target "$TARGET" \
            --title "AllInOneSonoff v${VERSION}" \
            --notes-file release/notes.md \
            --generate-notes \
            --latest \
            release/AllInOneSonoff_v${VERSION}.bin \
            release/AllInOneSonoff_v${VERSION}.ota.bin.gz \
            release/manifest.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ steps.version.outputs.version || 'failed' }}
          path: release/
          if-no-files-found: ignore
