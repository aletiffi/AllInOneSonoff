; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = sonoff_sv

; Firmware for the Sonoff r1
;   pio run                       build (+ signed .bin if keys/private.key exists)
;   pio run -t upload             flash by serial
;   pio test -e sonoff_sv         unit tests on the device
[env:sonoff_sv]
platform = espressif8266
board = sonoff_sv
framework = arduino
upload_protocol = esptool
board_build.f_cpu = 80000000L
; No filesystem: all the flash is used for firmware + OTA (EEPROM sector unchanged)
board_build.ldscript = eagle.flash.1m.ld
lib_deps =
	bblanchon/ArduinoJson@^6.17.2
	knolleary/PubSubClient@^2.8
	fastled/FastLED@3.6.0
extra_scripts = pre:scripts/signing.py
test_framework = unity
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_filters =
	colorize
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DCONFIG_ARDUHAL_LOG_COLORS=1

; Unit tests of the logic in lib/AppLogic on the PC, no hardware needed
;   pio test -e native
[env:native]
platform = native
test_framework = unity
lib_deps =
	bblanchon/ArduinoJson@^6.17.2
lib_ignore =
	DigiOut
	ReadInput
	StoreStrings
build_flags =
	-std=gnu++17
	-Wall
	-Wextra
